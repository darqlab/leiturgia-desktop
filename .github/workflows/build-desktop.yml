name: Build Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone parent server
        shell: bash
        run: |
          git clone --depth 1 https://github.com/darqlab/leiturgia.git build/leiturgia_server
          git -C build/leiturgia_server describe --tags --always --dirty > build/leiturgia_server/_server_version.txt

      - name: Install build dependencies
        run: pip install -r requirements-desktop.txt pyinstaller

      - name: Build onefile exe
        run: pyinstaller leiturgia.spec --noconfirm

      - name: Smoke test (headless)
        shell: pwsh
        env:
          LEITURGIA_HEADLESS: "1"
        run: |
          $exe = "$PWD\dist\leiturgia-desktop.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:5000/api/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "health check never returned 200" }
            $login = Invoke-WebRequest -Uri "http://127.0.0.1:5000/login" -UseBasicParsing -TimeoutSec 5
            if ($login.StatusCode -ne 200) { throw "login page returned $($login.StatusCode)" }
            Write-Host "smoke test passed"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") { $ver = "${{ github.ref_name }}".TrimStart('v') } else { $ver = "dev" }
          Compress-Archive -Path .\dist\leiturgia-desktop.exe -DestinationPath "dist\leiturgia-desktop-$ver.zip"
          Get-ChildItem dist\*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/leiturgia-desktop-*.zip


  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest hosted images, so the binary links against an older glibc.
          # arm64 = Raspberry Pi 4/5 on 64-bit Raspberry Pi OS (not 32-bit armv7).
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone parent server
        run: |
          git clone --depth 1 https://github.com/darqlab/leiturgia.git build/leiturgia_server
          git -C build/leiturgia_server describe --tags --always --dirty > build/leiturgia_server/_server_version.txt

      - name: Install Qt runtime libraries and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libdbus-1-3 libevent-2.1-7 libwebp7 libopus0 libxslt1.1 libminizip1 libpulse0

      - name: Install build dependencies
        run: pip install -r requirements-desktop.txt pyinstaller

      - name: Build onefile binary
        run: pyinstaller leiturgia.spec --noconfirm

      - name: Smoke test (headless)
        env:
          LEITURGIA_HEADLESS: "1"
        run: |
          ./dist/leiturgia-desktop &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != 1 ]; then kill $pid 2>/dev/null; echo "health check never returned 200"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/login)
          kill $pid 2>/dev/null || true
          [ "$code" = 200 ] || { echo "login page returned $code"; exit 1; }
          echo "smoke test passed"

      - name: Native window self-test (xvfb)
        env:
          LEITURGIA_SELFTEST: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          rm -f dist/config.json
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 120 ./dist/leiturgia-desktop 2>&1 | tee selftest.log
          grep -q NATIVE_WINDOW_OK selftest.log

      - name: Package tarball
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then ver="${GITHUB_REF_NAME#v}"; else ver=dev; fi
          tar -C dist -czf "dist/leiturgia-desktop-${ver}-linux-${{ matrix.arch }}.tar.gz" leiturgia-desktop
          ls -l dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/leiturgia-desktop-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: |
          sha256sum leiturgia-desktop-* > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/leiturgia-desktop-*
            out/checksums.txt
